{% extends "base.html" %}
{% block title %}Front office login{% endblock %}
{% block content %}
<div class="card login">
  <h1>Staff login</h1>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <div><label>Username</label><input name="user" autocomplete="username" required></div>
    <div><label>Password</label><input name="pass" type="password" autocomplete="current-password" required></div>
    <button type="submit">Open desk</button>
  </form>
  <p class="muted">Website appointments appear here as soon as a patient submits the form. Email still goes to appointments@thepulseheart.com.</p>
</div>
{% endblock %}
