<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Pulse Front Office{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Pulse Heart" width="120" height="48">
      <strong>Front office desk</strong>
    </div>
    {% if session.staff %}
    <nav>
      <a href="{{ url_for('desk') }}">Appointments</a>
      <a href="{{ url_for('report', month=today[:7]) }}">This month Excel</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
